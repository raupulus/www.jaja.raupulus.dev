openapi: 3.0.3
info:
  title: 'JaJa Project API Documentación Oficial'
  description: 'JaJa Project - La mejor comunidad para entretenimiento y compartir el humor'
  version: 1.0.0
servers:
  -
    url: 'https://jaja.raupulus.dev'
tags:
  -
    name: '🔐 Autenticación'
    description: ''
  -
    name: '🏷️ Categorías, Grupos y Tipos'
    description: ''
  -
    name: '📚 Contenidos'
    description: ''
  -
    name: '💡 Sugerencias'
    description: ''
  -
    name: '🚨 Reportes'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Para obtener tu token logueate con tu cuenta de usuario y lo recibirás en la respuesta. También puedes acceder al panel para <b>generar el API TOKEN desde tu perfil</b>.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: "Limitado a 3 intentos por minuto\n\nLo usamos para obtener token de acceso api y de sesión (para SPA por ejemplo)\n\nEl Token Bearer devuelto lo usaremos en los headers para las peticiones que requieran autenticación:\n\nBearer 5|dpsZX6OKLdrx1wYDfJqyMjg3kdAGdrmzDU4gMkJ1be4af09b"
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    token: 5|dpsZX6OKLdrx1wYDfJqyMjg3kdAGdrmzDU4gMkJ1be4af09b
                    user:
                      name: 'Juan Pérez'
                      nick: juanito
                      urlImage: 'https://ejemplo.com/storage/user-images/avatar.webp'
                      email: juan@ejemplo.com
                      email_verified_at: '2024-01-15T10:30:00.000000Z'
                  message: 'Login exitoso'
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 5|dpsZX6OKLdrx1wYDfJqyMjg3kdAGdrmzDU4gMkJ1be4af09b
                        description: 'Token Bearer para autenticación en futuras peticiones'
                      user:
                        type: object
                        properties:
                          name:
                            type: string
                            example: 'Juan Pérez'
                            description: 'Nombre completo del usuario'
                          nick:
                            type: string
                            example: juanito
                            description: 'Apodo único del usuario'
                          urlImage:
                            type: string
                            example: 'https://ejemplo.com/storage/user-images/avatar.webp'
                            description: 'URL completa de la imagen de perfil'
                          email:
                            type: string
                            example: juan@ejemplo.com
                            description: 'Email del usuario (incluido al ser el propio usuario)'
                          email_verified_at:
                            type: string
                            example: '2024-01-15T10:30:00.000000Z'
                            description: 'Fecha de verificación del email ISO 8601'
                        description: 'Información del usuario autenticado'
                    description: 'Datos de respuesta del login (solo si es exitoso)'
                  message:
                    type: string
                    example: 'Login exitoso'
                    description: 'Mensaje descriptivo de la operación'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Las credenciales proporcionadas son incorrectas.'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'Las credenciales proporcionadas son incorrectas.'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '🔐 Autenticación'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email del usuario. El formato del value no es válido.'
                  example: user@example.com
                password:
                  type: string
                  description: 'Contraseña del usuario. El campo value debe tener al menos 8 caracteres. El campo value debe ser menor que 100 caracteres.'
                  example: mipasswordsupersegura123123123
                device_name:
                  type: string
                  description: 'Nombre del dispositivo para generar el token y asociarlo a este. El campo value debe ser menor que 100 caracteres.'
                  example: 'Mi iPhone 13 Pro'
              required:
                - email
                - password
                - device_name
      security: []
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Cierra la sesión de un usuario e invalida el token de acceso utilizado en ese momento'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data: null
                  message: 'Sesión cerrada exitosamente'
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: string
                    example: null
                    description: 'null No se devuelven datos adicionales'
                  message:
                    type: string
                    example: 'Sesión cerrada exitosamente'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '🔐 Autenticación'
  /api/v1/auth/user:
    get:
      summary: 'Información de usuario'
      operationId: informacinDeUsuario
      description: 'Devuelve la información del usuario actualmente logueado en la plataforma'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    name: 'Juan Pérez'
                    nick: juanito
                    urlImage: 'https://ejemplo.com/storage/user-images/avatar.webp'
                    email: juan@ejemplo.com
                    email_verified_at: '2024-01-15T10:30:00.000000Z'
                  message: 'Información del usuario obtenida'
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: 'Juan Pérez'
                        description: 'Nombre completo del usuario'
                      nick:
                        type: string
                        example: juanito
                        description: 'Apodo único del usuario (máximo 25 caracteres)'
                      urlImage:
                        type: string
                        example: 'https://ejemplo.com/storage/user-images/avatar.webp'
                        description: 'URL completa de la imagen de perfil del usuario'
                      email:
                        type: string
                        example: juan@ejemplo.com
                        description: 'Email del usuario (solo si es el propio usuario autenticado)'
                      email_verified_at:
                        type: string
                        example: '2024-01-15T10:30:00.000000Z'
                        description: 'Fecha de verificación del email en formato ISO 8601 (solo si es el propio usuario autenticado)'
                    description: 'Datos del usuario'
                  message:
                    type: string
                    example: 'Información del usuario obtenida'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '🔐 Autenticación'
  /api/v1/types:
    get:
      summary: 'Tipos de Contenido'
      operationId: tiposDeContenido
      description: "Devuelve la lista de tipos de contenido que existen.\n\nÚtil para utilizar el slug del tipo que necesites y filtrar en otros endpoints."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    -
                      name: Chistes
                      slug: chistes
                      description: 'Chistes de la comunidad'
                      urlImage: 'https://jaja.raupulus.dev/images/default/type.webp'
                  message: 'Se obtuvieron 1 tipos'
                  meta:
                    total_items: 1
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: array
                    example:
                      -
                        name: Chistes
                        slug: chistes
                        description: 'Chistes de la comunidad'
                        urlImage: 'https://jaja.raupulus.dev/images/default/type.webp'
                    description: 'Lista de tipos de contenido disponibles'
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Chistes
                        slug:
                          type: string
                          example: chistes
                        description:
                          type: string
                          example: 'Chistes de la comunidad'
                        urlImage:
                          type: string
                          example: 'https://jaja.raupulus.dev/images/default/type.webp'
                  message:
                    type: string
                    example: 'Se obtuvieron 1 tipos'
                    description: 'Mensaje descriptivo de la operación'
                  meta:
                    type: object
                    properties:
                      total_items:
                        type: integer
                        example: 1
                        description: 'Número total de tipos disponibles'
                    description: 'Metadatos adicionales de la respuesta'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'No se encontraron tipos de contenido'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'No se encontraron tipos de contenido'
                    description: 'Mensaje descriptivo de la operación'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Error al obtener la lista de tipos'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'Error al obtener la lista de tipos'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '🏷️ Categorías, Grupos y Tipos'
  /api/v1/groups:
    get:
      summary: 'Grupos de Contenidos'
      operationId: gruposDeContenidos
      description: 'Devuelve la lista de grupos de contenido que existen paginados.'
      parameters:
        -
          in: query
          name: page
          description: 'Número de página a obtener. El campo value debe tener al menos 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Número de página a obtener. El campo value debe tener al menos 1.'
            example: 1
        -
          in: query
          name: limit
          description: 'Cantidad de elementos por página (máximo 50). El campo value debe tener al menos 1. El campo value no debe de ser mayor a 50.'
          example: 2
          required: false
          schema:
            type: integer
            description: 'Cantidad de elementos por página (máximo 50). El campo value debe tener al menos 1. El campo value no debe de ser mayor a 50.'
            example: 2
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    -
                      title: 'Chistes Devs'
                      slug: chistes-devs
                      urlImage: 'https://jaja.raupulus.dev/images/default/group.webp'
                  message: 'Se obtuvo 1 grupo de contenido'
                  meta:
                    pagination:
                      current_page: 1
                      per_page: 20
                      total: 1
                      last_page: 1
                      from: 1
                      to: 1
                      has_more_pages: false
                      has_previous_page: false
                      next_page_url: null
                      prev_page_url: null
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: array
                    example:
                      -
                        title: 'Chistes Devs'
                        slug: chistes-devs
                        urlImage: 'https://jaja.raupulus.dev/images/default/group.webp'
                    description: 'Lista de grupos de contenido paginados'
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          example: 'Chistes Devs'
                        slug:
                          type: string
                          example: chistes-devs
                        urlImage:
                          type: string
                          example: 'https://jaja.raupulus.dev/images/default/group.webp'
                  message:
                    type: string
                    example: 'Se obtuvo 1 grupo de contenido'
                    description: 'Mensaje descriptivo de la operación'
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                            description: 'Página actual'
                          per_page:
                            type: integer
                            example: 20
                            description: 'Elementos por página'
                          total:
                            type: integer
                            example: 1
                            description: 'Total de elementos disponibles'
                          last_page:
                            type: integer
                            example: 1
                            description: 'Número de la última página'
                          from:
                            type: integer
                            example: 1
                            description: 'Número del primer elemento en la página actual'
                          to:
                            type: integer
                            example: 1
                            description: 'Número del último elemento en la página actual'
                          has_more_pages:
                            type: boolean
                            example: false
                          has_previous_page:
                            type: boolean
                            example: false
                          next_page_url:
                            type: string
                            example: null
                            description: 'URL de la siguiente página (null si es la última)'
                          prev_page_url:
                            type: string
                            example: null
                            description: 'URL de la página anterior (null si es la primera)'
                        description: 'Información de paginación'
        404:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: ''
                    type: object
                    example:
                      success: false
                      message: 'La página solicitada no existe. Última página disponible: 2'
                    properties:
                      success:
                        type: boolean
                        example: false
                        description: 'Indica si la operación fue exitosa'
                      message:
                        type: string
                        example: 'La página solicitada no existe. Última página disponible: 2'
                        description: 'Mensaje descriptivo de la operación'
                  -
                    description: ''
                    type: object
                    example:
                      success: false
                      message: 'No se encontraron grupos de contenido'
                    properties:
                      success:
                        type: boolean
                        example: false
                        description: 'Indica si la operación fue exitosa'
                      message:
                        type: string
                        example: 'No se encontraron grupos de contenido'
                        description: 'Mensaje descriptivo de la operación'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Error al obtener la lista de grupos'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'Error al obtener la lista de grupos'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '🏷️ Categorías, Grupos y Tipos'
  /api/v1/categories:
    get:
      summary: Categorías
      operationId: categoras
      description: 'Devuelve la lista de categorías disponibles paginadas.'
      parameters:
        -
          in: query
          name: page
          description: 'Número de página a obtener. El campo value debe tener al menos 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Número de página a obtener. El campo value debe tener al menos 1.'
            example: 1
        -
          in: query
          name: limit
          description: 'Cantidad de elementos por página (máximo 50). El campo value debe tener al menos 1. El campo value no debe de ser mayor a 50.'
          example: 2
          required: false
          schema:
            type: integer
            description: 'Cantidad de elementos por página (máximo 50). El campo value debe tener al menos 1. El campo value no debe de ser mayor a 50.'
            example: 2
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    -
                      title: Programación
                      slug: programacion
                      description: 'Chistes de programación'
                      urlImage: 'https://jaja.raupulus.dev/images/default/category.webp'
                  message: 'Se obtuvo 1 categoría de 1, página 1.'
                  meta:
                    pagination:
                      current_page: 1
                      per_page: 20
                      total: 1
                      last_page: 1
                      from: 1
                      to: 1
                      has_more_pages: false
                      has_previous_page: false
                      next_page_url: null
                      prev_page_url: null
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: array
                    example:
                      -
                        title: Programación
                        slug: programacion
                        description: 'Chistes de programación'
                        urlImage: 'https://jaja.raupulus.dev/images/default/category.webp'
                    description: 'Lista de categorías paginadas'
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          example: Programación
                        slug:
                          type: string
                          example: programacion
                        description:
                          type: string
                          example: 'Chistes de programación'
                        urlImage:
                          type: string
                          example: 'https://jaja.raupulus.dev/images/default/category.webp'
                  message:
                    type: string
                    example: 'Se obtuvo 1 categoría de 1, página 1.'
                    description: 'Mensaje descriptivo de la operación'
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                            description: 'Página actual'
                          per_page:
                            type: integer
                            example: 20
                            description: 'Elementos por página'
                          total:
                            type: integer
                            example: 1
                            description: 'Total de elementos disponibles'
                          last_page:
                            type: integer
                            example: 1
                            description: 'Número de la última página'
                          from:
                            type: integer
                            example: 1
                            description: 'Número del primer elemento en la página actual'
                          to:
                            type: integer
                            example: 1
                            description: 'Número del último elemento en la página actual'
                          has_more_pages:
                            type: boolean
                            example: false
                          has_previous_page:
                            type: boolean
                            example: false
                          next_page_url:
                            type: string
                            example: null
                            description: 'URL de la siguiente página (null si es la última)'
                          prev_page_url:
                            type: string
                            example: null
                            description: 'URL de la página anterior (null si es la primera)'
                        description: 'Información de paginación'
        404:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: ''
                    type: object
                    example:
                      success: false
                      message: 'No se han encontrado categorías'
                    properties:
                      success:
                        type: boolean
                        example: false
                        description: 'Indica si la operación fue exitosa'
                      message:
                        type: string
                        example: 'No se han encontrado categorías'
                        description: 'Mensaje descriptivo de la operación'
                  -
                    description: ''
                    type: object
                    example:
                      success: false
                      message: 'La página solicitada no existe. Última página disponible: 5'
                    properties:
                      success:
                        type: boolean
                        example: false
                        description: 'Indica si la operación fue exitosa'
                      message:
                        type: string
                        example: 'La página solicitada no existe. Última página disponible: 5'
                        description: 'Mensaje descriptivo de la operación'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Error al obtener la lista de categorías'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'Error al obtener la lista de categorías'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '🏷️ Categorías, Grupos y Tipos'
  /api/v1/random:
    get:
      summary: 'Contenido Aleatorio'
      operationId: contenidoAleatorio
      description: "Devuelve un contenido aleatorio de entre todos los existentes en la plataforma sin filtro alguno.\n\nEste endpoint al ser público está limitado a máximo 5 elementos por petición y a 10 peticiones por minuto."
      parameters:
        -
          in: query
          name: limit
          description: 'Cantidad de elementos por página (máximo 5). El campo value debe tener al menos 1. El campo value no debe de ser mayor a 5.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Cantidad de elementos por página (máximo 5). El campo value debe tener al menos 1. El campo value no debe de ser mayor a 5.'
            example: 1
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    -
                      id: 12
                      title: 'El perro programador'
                      content: '¿Por qué el perro no compilaba? Porque tenía demasiadas pulgas.'
                      urlImage: null
                      uploader: '@raupulus'
                  message: 'Se obtuvo 1 contenido aleatorio'
                  meta:
                    total_items: 100
                    limit: 1
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: array
                    example:
                      -
                        id: 12
                        title: 'El perro programador'
                        content: '¿Por qué el perro no compilaba? Porque tenía demasiadas pulgas.'
                        urlImage: null
                        uploader: '@raupulus'
                    description: 'Colección de contenidos aleatorios'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 12
                        title:
                          type: string
                          example: 'El perro programador'
                        content:
                          type: string
                          example: '¿Por qué el perro no compilaba? Porque tenía demasiadas pulgas.'
                        urlImage:
                          type: string
                          example: null
                          nullable: true
                        uploader:
                          type: string
                          example: '@raupulus'
                  message:
                    type: string
                    example: 'Se obtuvo 1 contenido aleatorio'
                    description: 'Mensaje descriptivo de la operación'
                  meta:
                    type: object
                    properties:
                      total_items:
                        type: integer
                        example: 100
                        description: 'Número total de contenidos disponibles'
                      limit:
                        type: integer
                        example: 1
                        description: 'Límite aplicado en esta consulta'
                    description: 'Metadatos adicionales de la respuesta'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'No se encontraron contenidos'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'No se encontraron contenidos'
                    description: 'Mensaje descriptivo de la operación'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Error al obtener chistes aleatorios'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'Error al obtener chistes aleatorios'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '📚 Contenidos'
      security: []
  '/api/v1/random/{type_slug}':
    get:
      summary: 'Contenido Aleatorio por Tipo'
      operationId: contenidoAleatorioPorTipo
      description: "Devuelve un contenido aleatorio de entre todos los existentes en la plataforma filtrando por tipo\n[chistes|adivinanzas|quiz].\n\nEste endpoint al ser público está limitado a máximo 5 elementos por petición y a 10 peticiones por minuto."
      parameters:
        -
          in: query
          name: limit
          description: 'Cantidad de elementos por página (máximo 5). El campo value debe tener al menos 1. El campo value no debe de ser mayor a 5.'
          example: 1
          required: false
