openapi: 3.0.3
info:
  title: 'JaJa Project API Documentación Oficial'
  description: 'JaJa Project - La mejor comunidad para entretenimiento y compartir el humor'
  version: 1.0.0
servers:
  -
    url: 'https://jaja.raupulus.dev'
tags:
  -
    name: '🔐 Autenticación'
    description: ''
  -
    name: '💡 Sugerencias'
    description: ''
  -
    name: '🚨 Reportes'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Para obtener tu token logueate con tu cuenta de usuario y lo recibirás en la respuesta. También puedes acceder al panel para <b>generar el API TOKEN desde tu perfil</b>.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: "Limitado a 3 intentos por minuto\n\nLo usamos para obtener token de acceso api y de sesión (para SPA por ejemplo)\n\nEl Token Bearer devuelto lo usaremos en los headers para las peticiones que requieran autenticación:\n\nBearer 5|dpsZX6OKLdrx1wYDfJqyMjg3kdAGdrmzDU4gMkJ1be4af09b"
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    token: 5|dpsZX6OKLdrx1wYDfJqyMjg3kdAGdrmzDU4gMkJ1be4af09b
                    user:
                      name: 'Juan Pérez'
                      nick: juanito
                      urlImage: 'https://ejemplo.com/storage/user-images/avatar.webp'
                      email: juan@ejemplo.com
                      email_verified_at: '2024-01-15T10:30:00.000000Z'
                  message: 'Login exitoso'
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 5|dpsZX6OKLdrx1wYDfJqyMjg3kdAGdrmzDU4gMkJ1be4af09b
                        description: 'Token Bearer para autenticación en futuras peticiones'
                      user:
                        type: object
                        properties:
                          name:
                            type: string
                            example: 'Juan Pérez'
                            description: 'Nombre completo del usuario'
                          nick:
                            type: string
                            example: juanito
                            description: 'Apodo único del usuario'
                          urlImage:
                            type: string
                            example: 'https://ejemplo.com/storage/user-images/avatar.webp'
                            description: 'URL completa de la imagen de perfil'
                          email:
                            type: string
                            example: juan@ejemplo.com
                            description: 'Email del usuario (incluido al ser el propio usuario)'
                          email_verified_at:
                            type: string
                            example: '2024-01-15T10:30:00.000000Z'
                            description: 'Fecha de verificación del email ISO 8601'
                        description: 'Información del usuario autenticado'
                    description: 'Datos de respuesta del login (solo si es exitoso)'
                  message:
                    type: string
                    example: 'Login exitoso'
                    description: 'Mensaje descriptivo de la operación'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Las credenciales proporcionadas son incorrectas.'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'Las credenciales proporcionadas son incorrectas.'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '🔐 Autenticación'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email del usuario. El formato del value no es válido.'
                  example: user@example.com
                password:
                  type: string
                  description: 'Contraseña del usuario. El campo value debe tener al menos 8 caracteres. El campo value debe ser menor que 100 caracteres.'
                  example: mipasswordsupersegura123123123
                device_name:
                  type: string
                  description: 'Nombre del dispositivo para generar el token y asociarlo a este. El campo value debe ser menor que 100 caracteres.'
                  example: 'Mi iPhone 13 Pro'
              required:
                - email
                - password
                - device_name
      security: []
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Cierra la sesión de un usuario e invalida el token de acceso utilizado en ese momento'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data: null
                  message: 'Sesión cerrada exitosamente'
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: string
                    example: null
                    description: 'null No se devuelven datos adicionales'
                  message:
                    type: string
                    example: 'Sesión cerrada exitosamente'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '🔐 Autenticación'
  /api/v1/auth/user:
    get:
      summary: 'Información de usuario'
      operationId: informacinDeUsuario
      description: 'Devuelve la información del usuario actualmente logueado en la plataforma'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    name: 'Juan Pérez'
                    nick: juanito
                    urlImage: 'https://ejemplo.com/storage/user-images/avatar.webp'
                    email: juan@ejemplo.com
                    email_verified_at: '2024-01-15T10:30:00.000000Z'
                  message: 'Información del usuario obtenida'
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: 'Juan Pérez'
                        description: 'Nombre completo del usuario'
                      nick:
                        type: string
                        example: juanito
                        description: 'Apodo único del usuario (máximo 25 caracteres)'
                      urlImage:
                        type: string
                        example: 'https://ejemplo.com/storage/user-images/avatar.webp'
                        description: 'URL completa de la imagen de perfil del usuario'
                      email:
                        type: string
                        example: juan@ejemplo.com
                        description: 'Email del usuario (solo si es el propio usuario autenticado)'
                      email_verified_at:
                        type: string
                        example: '2024-01-15T10:30:00.000000Z'
                        description: 'Fecha de verificación del email en formato ISO 8601 (solo si es el propio usuario autenticado)'
                    description: 'Datos del usuario'
                  message:
                    type: string
                    example: 'Información del usuario obtenida'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '🔐 Autenticación'
  /api/v1/suggestion/send:
    post:
      summary: 'Envía una sugerencia de chiste a la plataforma'
      operationId: envaUnaSugerenciaDeChisteALaPlataforma
      description: 'Se permiten máximo 10 sugerencias en 1 minuto.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data: null
                  message: 'La sugerencia ha sido enviada correctamente.'
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: string
                    example: null
                    nullable: true
                  message:
                    type: string
                    example: 'La sugerencia ha sido enviada correctamente.'
                    description: 'Mensaje descriptivo de la operación'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Error al añadir sugerencia, si persiste contacta con el administrador'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'Error al añadir sugerencia, si persiste contacta con el administrador'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '💡 Sugerencias'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nick:
                  type: string
                  description: 'Nombre de usuario o nick del autor de la sugerencia (máximo 25 caracteres, solo letras, números y guiones bajos). Must match the regex /^[a-zA-Z0-9_]+$/. El campo value debe ser menor que 25 caracteres.'
                  example: mi_usuario_123
                title:
                  type: string
                  description: 'Título de la sugerencia (máximo 255 caracteres). El campo value debe ser menor que 255 caracteres.'
                  example: 'Pájaros caminantes'
                content:
                  type: string
                  description: 'Contenido principal de la sugerencia (chiste, adivinanza, etc.) - máximo 1024 caracteres. El campo value debe ser menor que 1024 caracteres.'
                  example: '¿Por qué los pájaros vuelan hacia el sur? Porque caminando tardarían mucho.'
              required:
                - content
  /api/v1/report/send:
    post:
      summary: 'Envía un reporte sobre contenido de la plataforma'
      operationId: envaUnReporteSobreContenidoDeLaPlataforma
      description: 'Se permiten máximo 10 reportes en 1 minuto por usuario.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    id: 1
                    title: 'Contenido inapropiado'
                    type: inappropriate_content
                    status: pending
                    content_id: 123
                    reporter_name: 'Juan Pérez'
                  message: 'El reporte ha sido enviado correctamente y será revisado por nuestro equipo.'
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Indica si la operación fue exitosa'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      title:
                        type: string
                        example: 'Contenido inapropiado'
                      type:
                        type: string
                        example: inappropriate_content
                      status:
                        type: string
                        example: pending
                      content_id:
                        type: integer
                        example: 123
                      reporter_name:
                        type: string
                        example: 'Juan Pérez'
                    description: 'Datos del reporte creado'
                  message:
                    type: string
                    example: 'El reporte ha sido enviado correctamente y será revisado por nuestro equipo.'
                    description: 'Mensaje descriptivo de la operación'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Error de validación'
                  errors:
                    content_id:
                      - 'El ID del contenido es requerido.'
                    title:
                      - 'El título del reporte es requerido.'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'Error de validación'
                    description: 'Mensaje descriptivo de la operación'
                  errors:
                    type: object
                    properties:
                      content_id:
                        type: array
                        example:
                          - 'El ID del contenido es requerido.'
                        items:
                          type: string
                      title:
                        type: array
                        example:
                          - 'El título del reporte es requerido.'
                        items:
                          type: string
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Error al enviar el reporte, si persiste contacta con el administrador'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Indica si la operación fue exitosa'
                  message:
                    type: string
                    example: 'Error al enviar el reporte, si persiste contacta con el administrador'
                    description: 'Mensaje descriptivo de la operación'
      tags:
        - '🚨 Reportes'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content_id:
                  type: integer
                  description: 'ID del contenido a reportar.'
                  example: 123
                title:
                  type: string
                  description: 'Título del reporte (máximo 255 caracteres).'
                  example: 'Contenido inapropiado'
                type:
                  type: string
                  description: 'Tipo de reporte. Valores aceptados: spam|inappropriate_content|adult_content|hate_speech|harassment.'
                  example: inappropriate_content
                  nullable: true
                description:
                  type: string
                  description: 'Descripción detallada del reporte (máximo 1024 caracteres).'
                  example: 'Este contenido contiene lenguaje ofensivo'
                  nullable: true
                additional_info:
                  type: string
                  description: 'Información adicional sobre el reporte (máximo 1024 caracteres).'
                  example: 'Reportado por múltiples usuarios'
                  nullable: true
                reporter_name:
                  type: string
                  description: 'Nombre del reportador (si difiere del usuario autenticado).'
                  example: 'Juan Pérez'
                  nullable: true
                reporter_email:
                  type: string
                  description: 'Email del reportador (si difiere del usuario autenticado).'
                  example: juan@example.com
                  nullable: true
              required:
                - content_id
                - title
